<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs><rect width="1000" height="880" fill="#f6f1e4"/><text x="500" y="46" text-anchor="middle" style="font-family:Georgia,serif;font-size:28px;font-weight:bold;" fill="#1d1b18">The elemental quadrant</text><text x="500" y="74" text-anchor="middle" style="font-family:Georgia,serif;font-size:16px;font-weight:normal;font-style:italic;" fill="#1d1b18">Neighbours put each other out. Opposites feed each other.</text><line x1="742" y1="364" x2="577" y2="245" stroke="#2f74b5" stroke-width="4" marker-end="url(#ah)"/><text x="755" y="265" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#2f74b5">Water douses Fire</text><text x="755" y="285" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#2f74b5">Smoldering/Enflamed → Steam</text><line x1="577" y1="594" x2="742" y2="475" stroke="#2a9d8f" stroke-width="4" marker-end="url(#ah)"/><text x="765" y="545" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#2a9d8f">Wind chills Water</text><text x="765" y="565" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#2a9d8f">Wet/Sodden → Chilled</text><line x1="257" y1="475" x2="422" y2="594" stroke="#8a5a32" stroke-width="4" marker-end="url(#ah)"/><text x="225" y="545" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#8a5a32">Earth grounds Wind</text><text x="225" y="565" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#8a5a32">Disoriented/Feverish → Grounded</text><line x1="422" y1="245" x2="257" y2="364" stroke="#c0392b" stroke-width="4" marker-end="url(#ah)"/><text x="240" y="265" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#c0392b">Fire bakes Earth</text><text x="240" y="285" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#c0392b">Burdened/Mired → Cracked</text><line x1="500" y1="290" x2="500" y2="550" stroke="#7a5c9e" stroke-width="3" stroke-dasharray="9 6"/><line x1="280" y1="420" x2="720" y2="420" stroke="#7a5c9e" stroke-width="3" stroke-dasharray="9 6"/><rect x="360" y="312" width="280" height="46" rx="6" fill="#f6f1e4"/><rect x="360" y="462" width="280" height="46" rx="6" fill="#f6f1e4"/><text x="500" y="330" text-anchor="middle" style="font-family:Georgia,serif;font-size:14px;font-weight:normal;" fill="#5b3f80">Wind fans Fire: Smoldering → Enflamed</text><text x="500" y="350" text-anchor="middle" style="font-family:Georgia,serif;font-size:14px;font-weight:normal;" fill="#5b3f80">Fire heats Wind: Disoriented → Feverish</text><text x="500" y="480" text-anchor="middle" style="font-family:Georgia,serif;font-size:14px;font-weight:normal;" fill="#5b3f80">Earth thickens Water: Wet → Sodden</text><text x="500" y="500" text-anchor="middle" style="font-family:Georgia,serif;font-size:14px;font-weight:normal;" fill="#5b3f80">Water muddies Earth: Burdened → Mired</text><circle cx="500" cy="190" r="88" fill="#c0392b" stroke="#1d1b18" stroke-width="2"/><text x="500" y="168" text-anchor="middle" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;" fill="#fff">FIRE</text><text x="500" y="198" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#fff">Smoldering</text><text x="500" y="218" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:bold;" fill="#fff">→ Enflamed</text><circle cx="820" cy="420" r="88" fill="#2f74b5" stroke="#1d1b18" stroke-width="2"/><text x="820" y="398" text-anchor="middle" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;" fill="#fff">WATER</text><text x="820" y="428" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#fff">Wet</text><text x="820" y="448" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:bold;" fill="#fff">→ Sodden</text><circle cx="500" cy="650" r="88" fill="#2a9d8f" stroke="#1d1b18" stroke-width="2"/><text x="500" y="628" text-anchor="middle" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;" fill="#fff">WIND</text><text x="500" y="658" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#fff">Disoriented</text><text x="500" y="678" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:bold;" fill="#fff">→ Feverish</text><circle cx="180" cy="420" r="88" fill="#8a5a32" stroke="#1d1b18" stroke-width="2"/><text x="180" y="398" text-anchor="middle" style="font-family:Georgia,serif;font-size:24px;font-weight:bold;" fill="#fff">EARTH</text><text x="180" y="428" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#fff">Burdened</text><text x="180" y="448" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:bold;" fill="#fff">→ Mired</text><text x="500" y="800" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#1d1b18">Each elemental hit, in order: 1. puts out what its element beats (leaving a one-turn state);</text><text x="500" y="822" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:normal;" fill="#1d1b18">2. upgrades its opposite's state to tier two; 3. inflicts its own state.</text><text x="500" y="852" text-anchor="middle" style="font-family:Georgia,serif;font-size:15px;font-weight:bold;" fill="#1d1b18">Putting out a tier-two state (Enflamed, Sodden, Feverish, Mired) gives the attacker an extra turn.</text></svg>